<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>思思行程安排</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
<section class="planner" aria-label="行程规划器"><div class="toolbar"><div><h1>思思行程安排</h1><p id="count"></p></div><div class="actions"><button id="reset" class="subtle">↻ 重置</button><button id="add" class="primary">＋ 添加节点</button></div></div>
<div class="legend"><span><i class="known"></i> 已知时间</span><span><i></i> 自动推算</span><span class="scroll-tip">左右滑动，查看完整行程 ↔</span></div>
<div class="timeline-scroll"><div id="timeline"></div></div>
<div class="status" id="status" role="status"></div>
<div class="summary"><div><span>行程开始</span><strong id="start">—</strong></div><div><span>行程结束</span><strong id="end">—</strong></div><div><span>预计总耗时</span><strong id="total">—</strong></div></div></section>
</main><script src="timeline.js"></script><script src="app.js"></script></body></html>
